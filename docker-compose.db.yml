version: "3.9"
services:
  db:
    image: postgres:16
    container_name: taskmanagerpro_db
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER before starting the local database}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS before starting the local database}
      POSTGRES_DB: ${DB_NAME:-taskdb}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:

