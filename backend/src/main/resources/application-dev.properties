# Local development requires explicit database credentials and a JWT signing key.
# Only the database host, port, and name have non-sensitive local defaults.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
